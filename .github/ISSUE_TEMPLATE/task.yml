name: Task
description: 프로젝트 작업을 등록합니다.
title: '[Task] '

body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 작업과 가장 관련 있는 영역을 선택해주세요.
      options:
        - Frontend
        - Backend
        - Kubernetes
        - CI/CD
        - Cloud / Terraform
        - On-premise
        - Network
        - Database
        - Monitoring
        - QA / Test
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 진행할 작업을 간단하게 작성해주세요.
      placeholder: |
        예) 상품 조회 요청에 대한 Redis 캐싱을 적용합니다.
        예) AWS VPC 및 Subnet을 Terraform으로 구성합니다.
        예) Product Service의 HPA를 구성합니다.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 필요한 경우 세부 작업을 작성해주세요.
      placeholder: |
        예)
        - [ ] 설정 파일 작성
        - [ ] 기능 적용
        - [ ] 정상 동작 확인
