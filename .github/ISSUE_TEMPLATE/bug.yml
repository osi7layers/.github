name: Bug
description: 오류 또는 예상과 다르게 동작하는 문제를 등록합니다.
title: '[Bug] '

body:
  - type: dropdown
    id: area
    attributes:
      label: 발생 영역
      description: 문제가 발생한 영역을 선택해주세요.
      options:
        - Frontend
        - Backend
        - Kubernetes
        - CI/CD
        - Cloud / Terraform
        - On-premise
        - Network
        - Database
        - Monitoring
        - QA / Test
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 내용
      description: 발생한 문제를 간단하게 작성해주세요.
      placeholder: |
        예) API 요청 시 500 오류가 발생합니다.
        예) Pod가 정상적으로 실행되지 않고 재시작됩니다.
        예) Terraform apply 실행 중 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 재현 가능한 경우 발생 과정을 작성해주세요.
      placeholder: |
        예)
        1. 특정 기능 실행
        2. 요청 또는 작업 수행
        3. 오류 발생

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 참고 자료
      description: 관련 로그, 에러 메시지, 스크린샷 등이 있다면 첨부해주세요.
      render: shell
